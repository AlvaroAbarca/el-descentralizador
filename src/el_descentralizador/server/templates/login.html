<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · El Descentralizador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,700;0,9..144,900&family=Archivo:wght@400;600&display=swap" rel="stylesheet">
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; display: grid; place-items: center;
           background: #0a0a0a; color: #f5f5f5; font-family: Archivo, sans-serif; }
    form { width: min(420px, 92vw); background: #141414; border: 1px solid #2b2b2b;
           padding: 36px 32px; }
    h1 { font: 900 2rem/1 Fraunces, serif; color: #f7c948; margin-bottom: 8px; }
    p { color: #828282; margin-bottom: 22px; font-size: 0.9rem; }
    label { display: block; font-size: 0.64rem; letter-spacing: 0.18em;
            text-transform: uppercase; color: #828282; margin-bottom: 6px; }
    input { width: 100%; background: #0a0a0a; border: none; border-bottom: 1px solid #4d4d4d;
            color: #f5f5f5; padding: 8px 2px; margin-bottom: 18px; font: 500 1rem Archivo, sans-serif; }
    input:focus { outline: none; border-bottom-color: #e8492f; }
    button { width: 100%; background: none; border: 1px solid #4d4d4d; color: #f5f5f5;
             padding: 12px; cursor: pointer; letter-spacing: 0.16em; text-transform: uppercase;
             font: 700 0.78rem Archivo, sans-serif; }
    button:hover { border-color: #e8492f; color: #e8492f; }
    .error { color: #e8492f; margin-bottom: 16px; font-size: 0.85rem; }
    a { color: #828282; display: inline-block; margin-top: 18px; font-size: 0.8rem; }
</style>
</head>
<body>
<form method="post" action="/login">
    <h1>El Descentralizador</h1>
    <p>Acceso de edición. Las noticias siguen siendo públicas.</p>
    {% if error %}
    <div class="error">Usuario o contraseña inválidos.</div>
    {% endif %}
    <label for="username">Usuario</label>
    <input id="username" name="username" autocomplete="username" required>
    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Entrar</button>
    <a href="/">↩ Volver al diario</a>
</form>
</body>
</html>
