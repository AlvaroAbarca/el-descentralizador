[project]
name = "el-descentralizador"
version = "0.1.0"
description = "Agregador de noticias regionales chilenas (menos Santiago)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "litestar[standard]>=2.24.0",
    "advanced-alchemy>=1.11.0",
    "litestar-saq[hiredis]>=0.8.0",
    "litestar-htmx>=0.5.0",
    "litestar-granian>=0.16.0",
    "asyncpg>=0.30.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "msgspec>=0.19.0",
    "httpx>=0.28.0",
    "feedparser>=6.0.11",
    "beautifulsoup4>=4.12.0",
    "python-dateutil>=2.9.0",
    "argon2-cffi>=23.1.0",
    "redis>=5.2.0",
    "jinja2>=3.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "anyio>=4.6.0",
    "pytest-databases[postgres,redis]>=0.13.0",
    "fakeredis>=2.26.0",
    "ruff>=0.8.0",
]

[project.scripts]
el-descentralizador = "el_descentralizador.server.asgi:create_app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/el_descentralizador"]

[tool.hatch.build.targets.wheel.force-include]
"src/el_descentralizador/server/templates" = "el_descentralizador/server/templates"
"src/el_descentralizador/data/medios_rss_actualizado.csv" = "el_descentralizador/data/medios_rss_actualizado.csv"

[tool.uv]
package = true

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"src/el_descentralizador/db/migrations/**" = ["UP", "I001", "E501"]
"src/el_descentralizador/server/seed.py" = ["ASYNC240"]
"scripts/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.litestar]
app = "el_descentralizador.server.asgi:create_app"
